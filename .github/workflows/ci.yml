name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up pnpm (version from packageManager)
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Build artifact twice and compare checksums
        run: |
          set -euo pipefail
          pnpm build:artifact
          first="$(cat artifact/*.sha256)"
          mv artifact artifact-first
          pnpm build:artifact
          second="$(cat artifact/*.sha256)"
          rm -rf artifact-first
          echo "first:  $first"
          echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::build:artifact is not reproducible"
            exit 1
          fi
          (cd artifact && sha256sum -c ./*.sha256)

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: plugin-tarball
          path: |
            artifact/*.tgz
            artifact/*.tgz.sha256
          if-no-files-found: error
